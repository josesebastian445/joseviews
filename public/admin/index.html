<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content Manager — Jose Sebastian</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        background: #0b0c0e;
      }
      /* Shown only until the CMS bundle takes over the page. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 12px;
        text-align: center;
        font-family: ui-monospace, "JetBrains Mono", monospace;
        color: #9aa0a8;
        font-size: 13px;
      }
      #boot strong {
        color: #4ade80;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <strong>Loading the editor…</strong>
      <span>If this doesn't disappear, check public/admin/config.yml</span>
    </div>

    <!-- Sveltia CMS: a drop-in, actively maintained replacement for Decap CMS
         that reads the same config.yml format. Loaded from CDN and pinned to a
         major version so a breaking release cannot take publishing offline. -->
    <script src="https://unpkg.com/@sveltia/cms@0/dist/sveltia-cms.js" type="module"></script>
  </body>
</html>
